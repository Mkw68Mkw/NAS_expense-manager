server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Must be at least the backend's MAX_UPLOAD_MB so CSV/backup uploads are not cut off.
    client_max_body_size 20m;

    # Locations below must not use add_header, otherwise these are no longer inherited.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS; using a variable makes Nginx re-resolve the backend
    # if its container is recreated with a new IP.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:5000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
